name: Build Jilo

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm jilo.spec
      - name: Smoke test (engine)
        run: python -c "import jilo.core, jilo.server; print('ok')"
      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\jilo.iss
      - name: Portable zip
        run: Compress-Archive -Path dist\Jilo -DestinationPath dist\Jilo-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jilo-Windows
          path: |
            dist/Jilo-Setup-*.exe
            dist/Jilo-Windows-portable.zip

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: AppleSilicon
          - runner: macos-13
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --noconfirm jilo.spec
      - name: DMG
        run: |
          mkdir -p dmg && cp -R dist/Jilo.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Jilo" -srcfolder dmg -ov -format UDZO "dist/Jilo-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Jilo-macOS-${{ matrix.arch }}
          path: dist/Jilo-macOS-*.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "v=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Jilo ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Jilo** — убирает полосы и мерцание LED-экранов за спикером.

            **Скачать:**
            - Windows — `Jilo-Setup-${{ steps.ver.outputs.v }}.exe` (установщик) или `Jilo-Windows-portable.zip` (без установки)
            - Mac с процессором Apple (M1/M2/M3/M4) — `Jilo-macOS-AppleSilicon.dmg`
            - Mac с процессором Intel — `Jilo-macOS-Intel.dmg`

            На Mac при первом запуске: правый клик по Jilo → «Открыть» → «Открыть».
          files: out/*
